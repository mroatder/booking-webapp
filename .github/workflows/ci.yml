name: CI

on:
  push:
    branches:
      - main # ทริกเกอร์อัตโนมัติเมื่อมีการ Push โค้ดเข้า branch main
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  # ==========================================
  # เฟสที่ 1: CI (ตรวจ + Build บน GitHub Cloud)
  # ==========================================
  build-and-test:
    name: Build & Test on GitHub Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ด่านกันข้อมูลลับหลุดขึ้น git: ถ้ามีไฟล์ต้องห้ามถูก track อยู่ หรือเนื้อไฟล์มีรหัสผ่าน/กุญแจ → pipeline ล้ม ไม่ deploy
      - name: Block secrets and server-only files
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key|pfx|crt|bak|mdf|ldf)$|(^|/)(uploads|certs)/' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "::error::พบไฟล์ที่ห้ามอยู่ใน git:"; echo "$bad"; exit 1; fi
          leak=$(git grep -n -I -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|^(DB_PASSWORD|SMTP_PASSWORD|LDAP_BIND_PASSWORD|JWT_SECRET)=[^[:space:]]+' -- . ':!backend/.env.example' ':!docs' ':!*.md' || true)
          if [ -n "$leak" ]; then echo "::error::พบข้อความที่เหมือนรหัสผ่าน/กุญแจ:"; echo "$leak" | cut -c1-80; exit 1; fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Frontend - install, lint, build
        working-directory: frontend
        run: |
          npm ci
          npm run lint:ui
          npm run lint:i18n
          npm run build

      # ตรวจช่องโหว่ของ dependency ที่ใช้จริงใน production (ล้มเมื่อพบระดับ high ขึ้นไป)
      - name: Dependency audit
        run: |
          npm audit --omit=dev --audit-level=high --prefix frontend
          npm audit --omit=dev --audit-level=high --prefix backend

      # test ที่ชื่อ *.integration.test.js ต่อฐานข้อมูลจริง → ไม่รันใน CI (ห้ามชี้ไปที่ฐานข้อมูล prod)
      - name: Backend - install and unit tests
        working-directory: backend
        run: |
          npm ci
          npx vitest run --exclude "**/*.integration.test.js"
